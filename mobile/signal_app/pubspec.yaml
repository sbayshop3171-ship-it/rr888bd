name: prime_signal_app
description: Demo Aviator signal terminal UI with API-ready dynamic bindings.
publish_to: "none"
# The build number (after +) is what the in-app updater compares — raise it
# for every APK that goes out. scripts/ship-signal-apk.sh reads it from here.
version: 0.2.5+7

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^9.2.4
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/aviator_signal_v9.png
